<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>oxherd - 流体物理动效值班打卡</title>
  <link rel="icon" type="image/png" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="/lantern-icon.svg" />
</head>
<body>
  <div id="app">
    <!-- 顶栏导航 -->
    <header class="app-header">
      <div class="header-top">
        <div class="brand-title">
          <img src="/lantern-icon.svg" width="24" height="24" style="border-radius:6px;" alt="提灯图标" />
          <span>oxherd</span>
          <span class="brand-badge" id="shift-badge">全天班</span>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="new-task-btn" title="值班模板与新建" aria-label="值班任务">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="12" y1="18" x2="12" y2="12"></line>
              <line x1="9" y1="15" x2="15" y2="15"></line>
            </svg>
          </button>
          <button class="icon-btn" id="system-settings-btn" title="通知与保活设置" aria-label="系统设置">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- 重点要求：岗位在设置中切换的交互入口卡片 -->
      <div class="current-post-bar" id="post-switch-bar">
        <div class="current-post-info">
          <div class="post-icon-box">📍</div>
          <div class="post-label-group">
            <span class="post-tag">当前值班岗位 (点击切换)</span>
            <span class="post-name-text" id="current-post-name">加载中...</span>
          </div>
        </div>
        <div class="post-switch-action">
          <span id="current-post-stats">0/0 项</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>
    </header>

    <!-- 总体进度看板 -->
    <section class="progress-card">
      <div class="progress-header">
        <span class="progress-title" id="task-title-display">图书馆日常巡查值班</span>
        <span class="progress-stats" id="task-percentage-display">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="task-progress-fill" style="width: 0%;"></div>
      </div>
    </section>

    <!-- 巡检条目流体列表 -->
    <main class="items-container" id="items-list">
      <!-- 动态填充检查条目 -->
    </main>

    <!-- 隐藏的文件/照片选择器 -->
    <input type="file" id="camera-file-input" accept="image/*" capture="environment" style="display:none;" />

    <!-- 底部动作栏：长按蓄力交班确认与添加条目 -->
    <footer class="bottom-dock">
      <button class="icon-btn" id="add-temp-item-btn" style="width:48px; height:48px;" title="临时添加巡检项">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>

      <button class="handover-hold-btn" id="handover-btn">
        <div class="hold-fill" id="handover-hold-fill"></div>
        <span class="hold-btn-text">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
          长按 1.5 秒确认交班（自动打包归档并刷新）
        </span>
      </button>
    </footer>

    <!-- 撤销提示胶囊 -->
    <div class="undo-toast" id="undo-toast">
      <span id="undo-text">已核验划除条目</span>
      <button class="undo-btn" id="undo-action-btn">撤销</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
